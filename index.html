<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Action Log — Frinks Edge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'f-primary': '#ff4301',
            'f-secondary': '#d1d5dc',
            'f-gray': '#312f2f',
            'f-dark-gray': '#7a7e80',
          },
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    html, body { font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
  </style>
</head>
<body class="bg-white text-f-gray">
  <div class="flex min-h-screen">
    <!-- ============ SIDEBAR ============ -->
    <aside class="fixed left-0 top-0 flex h-screen w-[350px] flex-col border-r border-r-gray-300 bg-[#1e1c1c] px-5 py-6 text-white" style="z-index:100">
      <!-- logo -->
      <div class="mb-10 mt-3 flex items-center px-4">
        <span class="text-3xl font-bold tracking-tight">frinks<span class="text-f-primary">.</span>edge</span>
      </div>

      <nav class="mt-2 flex-1 overflow-y-auto">
        <ul class="flex w-full flex-col gap-2 pb-4 text-white">
          <!-- Instances -->
          <li class="flex flex-col rounded-lg hover:bg-white/10">
            <div class="group flex cursor-pointer items-center rounded-md px-9 py-2">
              <div class="flex w-6 shrink-0 items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f7fcfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              </div>
              <span class="ml-4 text-lg">Instances</span>
            </div>
          </li>

          <!-- Integrations (open + active) -->
          <li class="flex flex-col rounded-lg bg-white/5 pb-3">
            <div class="group flex cursor-pointer items-center rounded-md px-9 py-2 text-white">
              <div class="flex w-6 shrink-0 items-center justify-center">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              </div>
              <span class="ml-4 text-lg">Integrations</span>
              <div class="ml-auto">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
              </div>
            </div>
            <ul class="ml-10 mt-2 flex flex-col gap-2">
              <li><a class="mr-6 flex items-center rounded-md px-9 py-2 text-sm text-white hover:bg-white/20">PLC Setup</a></li>
              <li><a class="mr-6 flex items-center rounded-md px-9 py-2 text-sm text-white hover:bg-white/20">PLC Read Configurations</a></li>
              <li><a class="mr-6 flex items-center rounded-md px-9 py-2 text-sm text-white hover:bg-white/20">PLC Write Configurations</a></li>
              <li><a class="mr-6 flex items-center rounded-md px-9 py-2 text-sm text-white hover:bg-white/20">Internal Action Configuration</a></li>
              <li><a class="mr-6 flex items-center rounded-md bg-white/20 px-9 py-2 text-sm font-medium text-white">Action Log</a></li>
            </ul>
          </li>

          <!-- Deployments -->
          <li class="flex flex-col rounded-lg hover:bg-white/10">
            <div class="group flex cursor-pointer items-center rounded-md px-9 py-2">
              <div class="flex w-6 shrink-0 items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f7fcfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>
              </div>
              <span class="ml-4 text-lg">Deployments</span>
            </div>
          </li>

          <!-- Health Monitor -->
          <li class="flex flex-col rounded-lg hover:bg-white/10">
            <div class="group flex cursor-pointer items-center rounded-md px-9 py-2">
              <div class="flex w-6 shrink-0 items-center justify-center">
                <svg width="16" height="18" viewBox="0 0 14 18" fill="none"><path d="M13 17V7M7 17V1M1 17V11" stroke="#f7fcfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <span class="ml-4 text-lg">Health Monitor</span>
            </div>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="ml-[350px] flex-1">
      <!-- top heading -->
      <div class="mt-1 flex h-[60px] items-baseline gap-2 bg-white px-5 py-4">
        <div class="text-3xl font-medium">Integrations</div>
        <div class="flex items-baseline gap-2 text-xl font-medium text-f-dark-gray">
          <span>/</span><span>Action Log</span>
        </div>
      </div>
      <div class="border-b border-gray-200"></div>

      <div class="relative min-h-[calc(100vh-100px)] bg-white pb-16">
        <!-- filter row -->
        <div class="flex items-center justify-between px-5 pb-4 pt-4">
          <div class="flex items-center gap-2">
            <select id="instanceFilter" class="w-40 rounded-md border border-gray-200 bg-white px-3 py-2 text-sm text-f-gray focus:outline-none">
              <option value="">All Instances</option>
              <option>Line-A Cap Inspection</option>
              <option>Line-B Weld Bead</option>
              <option>Line-C Assembly</option>
            </select>
            <select id="sourceFilter" class="w-52 rounded-md border border-gray-200 bg-white px-3 py-2 text-sm text-f-gray focus:outline-none">
              <option value="">All Sources</option>
              <option value="PLC Read Config">PLC Read Config</option>
              <option value="Internal Action Config">Internal Action Config</option>
              <option value="Dashboard">Dashboard</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-sm text-f-dark-gray">Total actions: <span id="countBadge" class="font-medium text-f-gray">0</span></span>
          </div>
        </div>

        <!-- table -->
        <div class="px-5 pb-5">
          <div class="w-full overflow-x-auto rounded-md border border-gray-200">
            <table class="min-w-full divide-y divide-gray-300" style="table-layout:auto">
              <thead class="sticky top-0 z-10">
                <tr class="relative bg-f-primary">
                  <th class="px-2 py-4 text-center text-base font-medium text-white">Action Name</th>
                  <th class="px-2 py-4 text-center text-base font-medium text-white">Variant</th>
                  <th class="px-2 py-4 text-center text-base font-medium text-white">Source</th>
                  <th class="px-2 py-4 text-center text-base font-medium text-white">Condition</th>
                  <th class="px-2 py-4 text-center text-base font-medium text-white">View Action</th>
                </tr>
              </thead>
              <tbody id="tbody" class="divide-y divide-gray-200 bg-white"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const rows = [
      { action: 'Trigger Image',        variant: 'Variant 1 - Front',  source: 'PLC Read Config',        condition: 'Register 100 == 1' },
      { action: 'Change Variant',       variant: 'Variant 2 - Rear',   source: 'PLC Read Config',        condition: 'Register 104 == 2' },
      { action: 'Write To PLC',         variant: 'Variant 1 - Front',  source: 'PLC Read Config',        condition: 'Coil 12 == True' },
      { action: 'Change Ground Truth',  variant: 'Variant 3 - Side',   source: 'PLC Read Config',        condition: 'Register 210 > 50' },
      { action: 'Write To DB',          variant: 'Variant 1 - Front',  source: 'PLC Read Config',        condition: 'Register 100 == 1' },
      { action: 'Trigger Image',        variant: 'Variant 2 - Rear',   source: 'Internal Action Config', condition: 'Verdict == NG' },
      { action: 'Change Ground Truth',  variant: 'Variant 2 - Rear',   source: 'Internal Action Config', condition: 'Defect Count >= 3' },
      { action: 'Write To DB',          variant: 'Variant 3 - Side',   source: 'Internal Action Config', condition: 'Verdict == OK' },
      { action: 'Reverse Judgement',    variant: 'Variant 1 - Front',  source: 'Internal Action Config', condition: 'Operator Override == True' },
      { action: 'Clear Captures',       variant: 'Variant 2 - Rear',   source: 'Internal Action Config', condition: 'Cycle End == True' },
      { action: 'Trigger Image',        variant: 'Variant 1 - Front',  source: 'Dashboard',              condition: 'Button: Capture Now' },
      { action: 'Write To PLC',         variant: 'Variant 2 - Rear',   source: 'Dashboard',              condition: 'Button: Accept Part' },
      { action: 'Change Variant',       variant: 'Variant 3 - Side',   source: 'Dashboard',              condition: 'Dropdown: Select Variant' },
      { action: 'Dashboard Refresh',    variant: '—',                  source: 'Dashboard',              condition: 'Button: Refresh View' },
      { action: 'Open Popup',           variant: '—',                  source: 'Dashboard',              condition: 'Button: Show Details' },
    ];

    const sourceStyle = {
      'PLC Read Config':        'bg-orange-50 text-f-primary ring-1 ring-inset ring-orange-200',
      'Internal Action Config': 'bg-blue-50 text-blue-600 ring-1 ring-inset ring-blue-200',
      'Dashboard':              'bg-green-50 text-green-700 ring-1 ring-inset ring-green-200',
    };

    const tbody = document.getElementById('tbody');
    const countBadge = document.getElementById('countBadge');
    const sourceFilter = document.getElementById('sourceFilter');

    function render() {
      const f = sourceFilter.value;
      const filtered = rows.filter(r => !f || r.source === f);
      tbody.innerHTML = filtered.map(r => `
        <tr class="hover:bg-gray-100">
          <td class="px-2 py-3 text-black"><div class="flex h-full w-full items-center justify-center text-center font-medium">${r.action}</div></td>
          <td class="px-2 py-3 text-black"><div class="flex h-full w-full items-center justify-center text-center">${r.variant}</div></td>
          <td class="px-2 py-3 text-black"><div class="flex h-full w-full items-center justify-center text-center"><span class="rounded px-2 py-0.5 text-xs font-medium ${sourceStyle[r.source]}">${r.source}</span></div></td>
          <td class="px-2 py-3 text-black"><div class="flex h-full w-full items-center justify-center text-center text-sm text-f-dark-gray">${r.condition}</div></td>
          <td class="px-2 py-3 text-black"><div class="flex h-full w-full items-center justify-center text-center"><a href="#" class="text-sm font-medium text-blue-600 hover:underline">View Action</a></div></td>
        </tr>
      `).join('');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="bg-white py-6 text-center text-[16px] font-normal text-gray-600">No actions found</td></tr>`;
      }
      countBadge.textContent = filtered.length;
    }

    sourceFilter.addEventListener('change', render);
    render();
  </script>
</body>
</html>
